name: MASTER - Build & Deploy

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  deploy-azure:
    runs-on: ubuntu-latest
    env:
      PATS__0: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        working-directory: src

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: dotnet publish
        run: dotnet publish ./AwesomeGithubStats.Api/AwesomeGithubStats.Api.csproj --no-restore -c Release -o ./out/ags

      - name: Azure Login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_DEPLOY }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: awesome-github-stats
          package: ./src/out/ags
